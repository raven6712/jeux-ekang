<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Songo – Jeu de semailles Ekang</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🌾 SONGO</h1>
<p class="sous-titre">Jeu de semailles Ekang</p>

<!-- ========== MENU ========== -->
<div id="menu">
  <p style="color:var(--terre); font-size:0.9rem; margin-bottom:8px; letter-spacing:1px;">Choisir un mode de jeu</p>
  <button class="btn-menu" onclick="demarrerJeu('ami')">🤝 Jouer avec un ami</button>
  <button class="btn-menu" onclick="demarrerJeu('ordi')">🤖 Jouer contre l'ordinateur</button>
</div>

<!-- ========== ZONE DE JEU ========== -->
<div id="jeu">

  <!-- Scores -->
  <div class="scores">
    <div class="joueur-info" id="info-nord">
      <div class="nom" id="nom-nord">NORD</div>
      <div class="score" id="score-nord">0</div>
    </div>
    <div class="tour-info" id="tour-info">Tour de SUD</div>
    <div class="joueur-info" id="info-sud">
      <div class="nom" id="nom-sud">SUD</div>
      <div class="score" id="score-sud">0</div>
    </div>
  </div>

  <!-- Tablier -->
  <div class="tablier">
    <div class="label-camp">NORD ← cases 1 à 7</div>
    <div class="rangee" id="rangee-nord"></div>
    <div style="height:10px"></div>
    <div class="rangee" id="rangee-sud"></div>
    <div class="label-camp">SUD ← cases 7 à 1</div>
  </div>

  <!-- Log -->
  <div id="log">Cliquez sur une de vos cases pour jouer.</div>

  <button id="btn-retour" onclick="retourMenu()">← Retour au menu</button>
</div>

<!-- ========== ALERTE ========== -->
<div id="alerte-overlay">
  <div id="alerte-boite">
    <div class="icone" id="alerte-icone">⚠️</div>
    <div class="titre" id="alerte-titre">Interdit !</div>
    <div class="message" id="alerte-message"></div>
    <button onclick="fermerAlerte()">Compris</button>
  </div>
</div>

<!-- ========== VICTOIRE ========== -->
<div id="victoire-overlay">
  <div id="victoire-boite">
    <div class="trophee">🏆</div>
    <div class="vainqueur" id="victoire-nom"></div>
    <div class="detail" id="victoire-detail"></div>
    <button onclick="retourMenu()">Rejouer</button>
  </div>
</div>
<script></script>
</body>
</html>
